<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>LilyMac Hub — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 24px;
      display: grid; place-items: center;
      background: #0f172a; color: #fff;
      font-family: Arial, sans-serif; text-align: center;
    }
    main { max-width: 440px; }
    .logo {
      width: 76px; height: 76px; margin: 0 auto 22px;
      border-radius: 22px; display: grid; place-items: center;
      background: linear-gradient(135deg,#2563eb,#312e81,#dc2626);
      font-size: 32px; font-weight: 800;
    }
    h1 { margin: 0 0 12px; font-size: 27px; }
    p { color: #cbd5e1; line-height: 1.65; }
    button {
      margin-top: 16px; padding: 13px 22px;
      border: 0; border-radius: 12px;
      background: #2563eb; color: white;
      font-size: 15px; font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">LM</div>
    <h1>You're offline</h1>
    <p>LilyMac Hub needs an internet connection to load live predictions and account information.</p>
    <p>Reconnect to the internet, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
